version: '3.8'

services:
  database:
    image: timescale/timescaledb:latest-pg16
    container_name: maatriva_timescale
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maatriva}
      POSTGRES_USER: ${POSTGRES_USER:-maatriva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always

  mqtt-broker:
    image: emqx/emqx:5.6.1
    container_name: maatriva_mqtt
    ports:
      - "1883:1883"       # MQTT TCP Port
      - "8883:8883"       # MQTT TLS Port (Production)
      - "18083:18083"     # Dashboard API/Web Console
    environment:
      EMQX_NAME: maatriva_broker
      EMQX_ALLOW_ANONYMOUS: "false"
    volumes:
      - emqx_data:/opt/emqx/data
    restart: always

  media-server:
    image: bluenentin/mediamtx:latest
    container_name: maatriva_mediamtx
    ports:
      - "8554:8554"       # RTSP Ingestion
      - "8889:8889"       # WebRTC streams API
      - "8888:8888"       # HLS streams
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maatriva_backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_CLIENT_ID: MaatrivaBackendServer
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - database
      - mqtt-broker
    restart: always

volumes:
  timescale_data:
  emqx_data:
